name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Testy jednostkowe (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/core.test.js
